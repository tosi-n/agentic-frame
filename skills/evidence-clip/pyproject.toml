[project]
name = "evidence-clip"
version = "0.1.0"
description = "Extract a sub-range of a video/audio file as a standalone evidence artifact with chain-of-custody and optional de-identification -- ffmpeg plus one real hosted call for transcript PII scrubbing."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    # Ships a static ffmpeg binary so the skill self-provisions in a bare
    # code-runtime sandbox (no system ffmpeg). helpers/_ffbin.py resolves it;
    # a system ffmpeg on PATH is still preferred on a dev machine.
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
]
